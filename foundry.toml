[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]

# The launch verifier carries exactly this compiler offline; it is pinned by version, never by path.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The launch compares deployed bytes without a metadata hash, so the build must not embed one.
bytecode_hash = "none"
cbor_metadata = false

# No external process execution and no filesystem access from tests or scripts.
ffi = false
fs_permissions = []

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
auto_detect_remappings = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
